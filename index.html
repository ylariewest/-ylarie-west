<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ylarie West</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 25px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 40px;
    }

    p {
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin: 10px;
      padding: 14px 24px;
      background: #172033;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .demo {
      margin-top: 25px;
      padding: 12px;
      background: #fff4d6;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h2>Ylarie West</h2>
</header>

<div class="container">
  <div class="card">
    <h1>Bienvenue sur Ylarie West</h1>

    <p>
      Votre espace de gestion et de simulation d’investissement.
    </p>

    <a href="#" class="button">Créer un compte</a>
    <a href="#" class="button">Se connecter</a>

    <div class="demo">
      ⚠️ VERSION DÉMO — Aucun dépôt ou retrait d’argent réel.
    </div>
  </div>
</div>

</body>
</html>
