<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ylarie West</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h1, h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 9px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      background: #172033;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .demo {
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 9px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h2>Ylarie West</h2>
</header>

<div class="container">

  <div class="card">
    <h1>Créer un compte</h1>

    <input type="text" placeholder="Nom complet">
    <input type="email" placeholder="Adresse e-mail">
    <input type="password" placeholder="Mot de passe">

    <button onclick="alert('Compte créé — version démo')">
      Créer mon compte
    </button>
  </div>

  <div class="card">
    <h2>Se connecter</h2>

    <input type="email" placeholder="Adresse e-mail">
    <input type="password" placeholder="Mot de passe">

    <button onclick="alert('Connexion — version démo')">
      Se connecter
    </button>
  </div>

  <div class="demo">
    ⚠️ VERSION DÉMO — Aucun argent réel n'est accepté.
  </div>

</div>

</body>
</html>
